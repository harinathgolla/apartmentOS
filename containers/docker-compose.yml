name: apartment-saas

services:
  # ═══════════════════════════════════════════════════════
  # PostgreSQL — the source of truth
  # ═══════════════════════════════════════════════════════
  postgres:
    build:
      context: ./postgres
    image: apartment-saas/postgres:16
    pull_policy: build
    container_name: apt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - apartment-net

  # ═══════════════════════════════════════════════════════
  # pgAdmin — visual DB browser
  # ═══════════════════════════════════════════════════════
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: apt-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "${PGADMIN_PORT}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - apartment-net

  # ═══════════════════════════════════════════════════════
  # Redis — cache, sessions, rate limits
  # ═══════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: apt-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - apartment-net

  # ═══════════════════════════════════════════════════════
  # MailHog — catch all outgoing email in dev
  # Visit http://localhost:8025 to see messages
  # ═══════════════════════════════════════════════════════
  mailhog:
    image: mailhog/mailhog:latest
    container_name: apt-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT}:1025"
      - "${MAILHOG_UI_PORT}:8025"
    networks:
      - apartment-net
    profiles: ["dev"]   # only runs in dev profile
  
  # ═══════════════════════════════════════════════════════
  # MailHog — catch all outgoing email in dev
  # Visit http://localhost:8025 to see messages
  # ═══════════════════════════════════════════════════════
  mock-oauth:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    container_name: apt-mock-oauth
    restart: unless-stopped
    ports:
      - "${MOCK_OAUTH_PORT}:8080"
    environment:
      JSON_CONFIG: |
        {
          "interactiveLogin": true,
          "httpServer": "NettyWrapper",
          "tokenCallbacks": [
            {
              "issuerId": "google",
              "tokenExpiry": 3600,
              "requestMappings": [
                {
                  "requestParam": "scope",
                  "match": "*",
                  "claims": {
                    "sub": "mock-google-user-1",
                    "email": "owner@saienclave.test",
                    "email_verified": true,
                    "name": "Mock Owner"
                  }
                }
              ]
            }
          ]
        }
    networks:
      - apartment-net    

  # ═══════════════════════════════════════════════════════
  # Backend — Spring Boot 4 (built from backend/Dockerfile)
  # ═══════════════════════════════════════════════════════
  backend:
    build:
      context: ../backend
      dockerfile: ../containers/backend/Dockerfile
    image: apartment-saas/backend:latest
    pull_policy: build
    container_name: apt-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_MAIL_HOST: mailhog
      SPRING_MAIL_PORT: 1025
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      APP_FRONTEND_URL: http://localhost:${FRONTEND_PORT}
    ports:
      - "${BACKEND_PORT}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - apartment-net
    profiles: ["full"]   # opt-in so you can run backend locally with mvn if you want

  # ═══════════════════════════════════════════════════════
  # Frontend — Next.js 14
  # ═══════════════════════════════════════════════════════
  frontend:
    build:
      context: ../frontend
      dockerfile: ../containers/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    image: apartment-saas/frontend:latest
    pull_policy: build
    container_name: apt-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      - backend
    networks:
      - apartment-net
    profiles: ["full"]

  # ═══════════════════════════════════════════════════════
  # Nginx — reverse proxy for production-like setup
  # ═══════════════════════════════════════════════════════
  nginx:
    build:
      context: ./nginx
    image: apartment-saas/nginx:latest
    pull_policy: build
    container_name: apt-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - apartment-net
    profiles: ["prod"]

volumes:
  postgres_data:
  pgadmin_data:
  redis_data:

networks:
  apartment-net:
    driver: bridge