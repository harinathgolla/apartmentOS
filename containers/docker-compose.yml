name: apartment-saas

services:
  # ═══════════════════════════════════════════════════════
  # MySQL — the source of truth
  # ═══════════════════════════════════════════════════════
  mysql:
    image: mysql:8.4
    container_name: apt-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "${MYSQL_PORT}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s
    networks:
      - apartment-net

  # ═══════════════════════════════════════════════════════
  # Redis — cache, sessions, rate limits
  # ═══════════════════════════════════════════════════════
  redis:
    image: redis:7-alpine
    container_name: apt-redis
    restart: unless-stopped
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${REDIS_PORT}:6379"
    volumes:
      - redis_data:/data
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - apartment-net

  # ═══════════════════════════════════════════════════════
  # MailHog — catch all outgoing email in dev
  # Visit http://localhost:8025 to see messages
  # ═══════════════════════════════════════════════════════
  mailhog:
    image: mailhog/mailhog:latest
    container_name: apt-mailhog
    restart: unless-stopped
    ports:
      - "${MAILHOG_SMTP_PORT}:1025"
      - "${MAILHOG_UI_PORT}:8025"
    networks:
      - apartment-net
    profiles: ["dev","full"]   # only runs in dev profile
  
  # ═══════════════════════════════════════════════════════
  # MailHog — catch all outgoing email in dev
  # Visit http://localhost:8025 to see messages
  # ═══════════════════════════════════════════════════════
  mock-oauth:
    image: ghcr.io/navikt/mock-oauth2-server:2.1.10
    container_name: apt-mock-oauth
    restart: unless-stopped
    ports:
      - "${MOCK_OAUTH_PORT}:8080"
    environment:
      JSON_CONFIG: |
        {
          "interactiveLogin": true,
          "httpServer": "NettyWrapper",
          "tokenCallbacks": [
            {
              "issuerId": "google",
              "tokenExpiry": 3600,
              "requestMappings": [
                {
                  "requestParam": "scope",
                  "match": "*",
                  "claims": {
                    "sub": "mock-google-user-1",
                    "email": "owner@saienclave.test",
                    "email_verified": true,
                    "name": "Mock Owner",
                    "aud": "mock-client-id",
                    "azp": "mock-client-id"
                  }
                }
              ]
            }
          ]
        }
    networks:
      - apartment-net    

  # ═══════════════════════════════════════════════════════
  # Backend — Spring Boot 4 (built from backend/Dockerfile)
  # ═══════════════════════════════════════════════════════
  backend:
    build:
      context: ../backend
      dockerfile: ../containers/backend/Dockerfile
    image: apartment-saas/backend:latest
    pull_policy: build
    container_name: apt-backend
    restart: unless-stopped
    environment:
      # docker = DB/host wiring; mock-oauth = route Google login to local mock-oauth2 (dev)
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-docker,mock-oauth}
      SPRING_DATASOURCE_URL: jdbc:mysql://apt-mysql:3306/${MYSQL_DATABASE}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      SPRING_DATA_REDIS_HOST: apt-redis
      SPRING_DATA_REDIS_PORT: 6379
      SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD}
      SPRING_MAIL_HOST: apt-mailhog
      SPRING_MAIL_PORT: 1025
      # OAuth wiring is driven by application-mock-oauth.yml: Spring discovers
      # from http://mock-oauth:8080/google over the container network, and only
      # the browser-facing authorization-uri is overridden to localhost:9000.
      JWT_SECRET: ${JWT_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      # Browser-facing URL used for OAuth success redirects. Through nginx this
      # is http://localhost (port 80); the dev profile can override to :3000.
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost}
    ports:
      - "${BACKEND_PORT}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - apartment-net
    profiles: ["full"]   # opt-in so you can run backend locally with mvn if you want

  # ═══════════════════════════════════════════════════════
  # Frontend — Next.js 14
  # ═══════════════════════════════════════════════════════
  frontend:
    build:
      context: ../frontend
      dockerfile: ../containers/frontend/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    image: apartment-saas/frontend:latest
    pull_policy: build
    container_name: apt-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    ports:
      - "${FRONTEND_PORT}:3000"
    depends_on:
      - backend
    networks:
      - apartment-net
    profiles: ["full"]

  # ═══════════════════════════════════════════════════════
  # Nginx — reverse proxy for production-like setup
  # ═══════════════════════════════════════════════════════
  nginx:
    build:
      context: ./nginx
    image: apartment-saas/nginx:latest
    pull_policy: build
    container_name: apt-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_HTTP_PORT}:80"
      - "${NGINX_HTTPS_PORT}:443"
    depends_on:
      - backend
      - frontend
    volumes:
      - ./nginx/certs:/etc/nginx/certs:ro
    networks:
      - apartment-net
    profiles: ["prod"]

volumes:
  mysql_data:
  redis_data:

networks:
  apartment-net:
    driver: bridge