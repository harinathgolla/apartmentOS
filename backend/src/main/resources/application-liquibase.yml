# Dedicated profile for schema migrations via Liquibase.
#
# Usage:
#   PostgreSQL (default):  mvn spring-boot:run -Dspring-boot.run.profiles=liquibase
#   MySQL:                 mvn spring-boot:run -Dspring-boot.run.profiles=liquibase,mysql
#
# Or run Liquibase through Spring with `spring.liquibase.enabled=true` and this profile.
# All changelogs are DB-agnostic XML so the same scripts apply to both databases.

spring:
  # Turn off Hibernate DDL — Liquibase owns the schema.
  jpa:
    hibernate:
      ddl-auto: validate

  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
    contexts: dev
    # Drop-first is OFF by default for safety. Enable only on throwaway dev DBs:
    #   drop-first: true
    parameters:
      # Reserved for future DB-specific defaults (e.g. charset).
      charset: utf8mb4

# ── Optional MySQL override (profile: mysql) ──────────────────────────────
---
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:apartment_db}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root}
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    properties:
      hibernate.jdbc.time_zone: UTC
