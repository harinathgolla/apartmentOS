# Dev-only profile. Activate with: --spring.profiles.active=mock-oauth
# Redirects the "google" OAuth2 registration to the local mock-oauth2-server.
spring:
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: mock-client-id
            client-secret: mock-client-secret
            authorization-grant-type: authorization_code
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
            # mock-oauth2-server REQUIRES "openid" in the scope (it rejects the
            # authorize request otherwise: "the scope must include an openid value").
            # With openid, Spring uses the OIDC provider, which validates the ID
            # token's iss/aud/azp. The mock server's token includes "aud" thanks to
            # the added claim in containers/mock-oauth/config.json.
            scope:
              - openid
              - email
              - profile
        provider:
          google:
            # Let Spring do OIDC discovery against the mock server over the
            # container network (mock-oauth:8080). Discovery there returns a
            # fully self-consistent document (issuer + token + jwks + userinfo
            # all on the same host), so no URLs are hand-assembled.
            #
            # The ONLY override is the authorization endpoint: the BROWSER is
            # redirected there, and mock-oauth:8080 is not resolvable from the
            # host. localhost:9000 is the host-published port for mock-oauth.
            issuer-uri: ${MOCK_OAUTH_ISSUER_URI:http://mock-oauth:8080/google}
            authorization-uri: ${MOCK_OAUTH_AUTHORIZATION_URI:http://localhost:9000/google/authorize}
  mail:
    # Default = localhost (host runs -> MailHog on localhost:1025).
    # docker-compose overrides SPRING_MAIL_HOST=mailhog / PORT=1025 for the container.
    host: ${SPRING_MAIL_HOST:localhost}
    port: ${SPRING_MAIL_PORT:1025}
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: false

app:
  mail:
    provider: smtp          # route all mail to MailHog in this profile