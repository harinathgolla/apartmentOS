server:
  port: 8080

spring:
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:mysql://localhost:3307/apartment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: apartment
    password: apartment
    hikari:
      maximum-pool-size: 20
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.jdbc.batch_size: 30
      hibernate.order_inserts: true
      hibernate.order_updates: true
  # Schema managed exclusively by Liquibase
  liquibase:
    enabled: true
    change-log: classpath:db/changelog/db.changelog-master.xml
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:not-configured}
            client-secret: ${GOOGLE_CLIENT_SECRET:not-configured}
            scope:
              - openid
              - email
              - profile
              - https://www.googleapis.com/auth/gmail.send
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
  mail:
    host: smtp.gmail.com
    port: 587
    properties:
      mail.smtp.auth: false
      mail.smtp.starttls.enable: true

app:
  jwt:
    secret: ${JWT_SECRET:please-change-this-32-byte-dev-secret-xxxxxxxx}
    expiration-ms: 86400000
    refresh-expiration-ms: 2592000000
  frontend:
    url: ${FRONTEND_URL:http://localhost:3000}
  gmail:
    from-name: "Apartment Manager"
  razorpay:
    key-id: ${RAZORPAY_KEY_ID:rzp_test_xxx}
    key-secret: ${RAZORPAY_KEY_SECRET:xxx}
    webhook-secret: ${RAZORPAY_WEBHOOK_SECRET:xxx}
    currency: INR
  billing:
    trial-days: 30
    plans:
      TRIAL:
        max-apartments: 1
        max-flats: 10
        price-inr: 0
      STARTER:
        max-apartments: 1
        max-flats: 40
        price-inr: 499
      PRO:
        max-apartments: 5
        max-flats: 300
        price-inr: 1499
      ENTERPRISE:
        max-apartments: 999
        max-flats: 99999
        price-inr: 4999

logging:
  level:
    com.apartment: DEBUG
