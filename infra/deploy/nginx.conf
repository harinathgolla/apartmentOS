# ═══════════════════════════════════════════════════════════════════
# ApartmentOS host nginx — HTTP :80 redirects to HTTPS :443.
#
# Upstreams are addressed through VARIABLES with the Docker embedded
# resolver so nginx starts even if backend/frontend are not yet up, and
# so a recreated container's new IP is picked up per-request instead of
# being frozen at config parse time.
# ═══════════════════════════════════════════════════════════════════
resolver 127.0.0.11 valid=10s ipv6=off;
resolver_timeout 5s;

# ── HTTP :80 — health probe stays plain, everything else → HTTPS ─────
server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    location /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── HTTPS :443 — TLS termination + reverse proxy ────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name _;

    client_max_body_size 20m;

    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Short max-age: the cert is self-signed per-host, so keep HSTS
    # conservative rather than pinning browsers for a year.
    add_header Strict-Transport-Security "max-age=300" always;

    # Backend API
    location /api/ {
        set $backend_upstream "backend:8080";
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
        proxy_read_timeout 120s;
    }

    # OAuth callbacks (Google requires HTTPS redirect URIs)
    location /oauth2/ {
        set $backend_upstream "backend:8080";
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }
    location /login/oauth2/ {
        set $backend_upstream "backend:8080";
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }

    # Spring actuator — kept behind TLS like the rest of the API
    location /actuator/ {
        set $backend_upstream "backend:8080";
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Everything else → Next.js
    location / {
        set $frontend_upstream "frontend:3000";
        proxy_pass http://$frontend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Port 443;
    }
}
