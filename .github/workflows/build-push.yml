name: Build and push images to GHCR

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/apartmentos

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write        # required to push to GHCR with GITHUB_TOKEN

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lowercase image prefix
        id: img
        run: echo "prefix=${IMAGE_PREFIX,,}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # ─────────────────────────── backend ───────────────────────────
      - name: Build and push backend (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          file: ./containers/backend/Dockerfile
          platforms: linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ steps.img.outputs.prefix }}-backend:latest
            ${{ env.REGISTRY }}/${{ steps.img.outputs.prefix }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      # ─────────────────────────── frontend ──────────────────────────
      - name: Build and push frontend (linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./containers/frontend/Dockerfile
          platforms: linux/arm64
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL || 'http://localhost:8080' }}
          tags: |
            ${{ env.REGISTRY }}/${{ steps.img.outputs.prefix }}-frontend:latest
            ${{ env.REGISTRY }}/${{ steps.img.outputs.prefix }}-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Summary
        run: |
          echo "### Images pushed" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ steps.img.outputs.prefix }}-backend:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- \`ghcr.io/${{ steps.img.outputs.prefix }}-frontend:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "- platform: linux/arm64" >> $GITHUB_STEP_SUMMARY
